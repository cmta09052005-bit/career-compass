<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="magnifying-glass-title"><title id="magnifying-glass-title">Magnifying glass</title><defs>
<linearGradient id="magnifying-glass-gold" x1="0" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff0b5"/><stop offset=".24" stop-color="#d4a017"/><stop offset=".48" stop-color="#b57a25"/><stop offset=".62" stop-color="#edc975"/><stop offset="1" stop-color="#805025"/></linearGradient>
<linearGradient id="magnifying-glass-paper" x2=".8" y2="1"><stop stop-color="#fff5db"/><stop offset=".55" stop-color="#f5ecd7"/><stop offset="1" stop-color="#cbb185"/></linearGradient>
<linearGradient id="magnifying-glass-navy" x2="1" y2="1"><stop stop-color="#344b6a"/><stop offset=".55" stop-color="#1b2a4a"/><stop offset="1" stop-color="#101b30"/></linearGradient>
