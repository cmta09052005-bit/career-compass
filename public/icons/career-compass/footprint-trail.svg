<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="footprint-trail-title"><title id="footprint-trail-title">Dotted footprint trail</title><defs>
<linearGradient id="footprint-trail-gold" x1="0" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff0b5"/><stop offset=".24" stop-color="#d4a017"/><stop offset=".48" stop-color="#b57a25"/><stop offset=".62" stop-color="#edc975"/><stop offset="1" stop-color="#805025"/></linearGradient>
<linearGradient id="footprint-trail-paper" x2=".8" y2="1"><stop stop-color="#fff5db"/><stop offset=".55" stop-color="#f5ecd7"/><stop offset="1" stop-color="#cbb185"/></linearGradient>
<linearGradient id="footprint-trail-navy" x2="1" y2="1"><stop stop-color="#344b6a"/><stop offset=".55" stop-color="#1b2a4a"/><stop offset="1" stop-color="#101b30"/></linearGradient>
<pattern id="footprint-trail-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><path d="M0 0V5" stroke="#1b2a4a" stroke-width=".7" opacity=".6"/></pattern>
<filter id="footprint-trail-grain" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope=".3" intercept=".74"/><feFuncG type="linear" slope=".3" intercept=".74"/><feFuncB type="linear" slope=".3" intercept=".74"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/><feComposite in2="SourceGraphic" operator="in"/></filter><filter id="footprint-trail-mist" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
