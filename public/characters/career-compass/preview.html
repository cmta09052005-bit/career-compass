<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Compass — Explorer portraits</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#1b2a4a;color:#f5ecd7;font-family:Georgia,serif}header{max-width:1100px;margin:0 auto 30px}h1{font-size:34px;color:#edc975;margin:0 0 12px}header p{font:14px/1.7 system-ui,sans-serif;max-width:640px;color:#d4d6d8}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1100px;margin:auto}figure{margin:0;border:1px solid #aa8650;border-radius:6px;overflow:hidden;background:#f5ecd7;color:#1b2a4a}.portrait{aspect-ratio:1;background:#f5ecd7}img{width:100%;height:100%;object-fit:contain;display:block}figcaption{padding:18px 22px;border-top:1px solid #bba379;font-size:20px}figcaption p{font:12px/1.6 system-ui,sans-serif;color:#665842;margin-bottom:0}.controls{display:flex;gap:10px;margin:20px 0}button{font:12px system-ui,sans-serif;background:transparent;color:#f5ecd7;border:1px solid #ba985b;padding:10px 15px;border-radius:3px;cursor:pointer}button[aria-pressed=true]{background:#d4a017;color:#1b2a4a}body[data-bg=navy] .portrait{background:#1b2a4a}body[data-bg=checker] .portrait{background-color:#eee;background-image:conic-gradient(#d0d0d0 25%,transparent 0 50%,#d0d0d0 0 75%,transparent 0);background-size:24px 24px}@media(max-width:700px){body{padding:20px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figcaption{padding:12px;font-size:16px}h1{font-size:26px}}
</style></head><body data-bg="parchment"><header><h1>Meet the Explorers</h1><p>Career Compass · Six hand-drawn adventure portraits.<br>Six 1254 × 1254 PNG illustrations. Background transparency correction pending.</p><div class="controls" aria-label="Preview background"><button data-bg="parchment" aria-pressed="true">Parchment</button><button data-bg="navy" aria-pressed="false">Navy</button><button data-bg="checker" aria-pressed="false">Transparency grid</button></div></header><main class="gallery">
<figure><div class="portrait"><img src="the-wanderer.png" alt="The Wanderer in a worn cloak with a satchel"></div><figcaption>The Wanderer<p>Worn traveling cloak · Small satchel</p></figcaption></figure>
<figure><div class="portrait"><img src="the-trailblazer.png" alt="The Trailblazer leaning forward with a walking stick"></div><figcaption>The Trailblazer<p>Walking stick · Rugged boots</p></figcaption></figure>
<figure><div class="portrait"><img src="the-scout.png" alt="The Scout with binoculars and an alert posture"></div><figcaption>The Scout<p>Binoculars · Alert posture</p></figcaption></figure>
<figure><div class="portrait"><img src="the-cartographer.png" alt="The Cartographer with a rolled map and quill"></div><figcaption>The Cartographer<p>Rolled map · Quill</p></figcaption></figure>
<figure><div class="portrait"><img src="the-ranger.png" alt="The Ranger holding a lantern in a steady stance"></div><figcaption>The Ranger<p>Lantern · Calm and steady</p></figcaption></figure>
<figure><div class="portrait"><img src="the-navigator.png" alt="The Navigator holding a compass and looking outward"></div><figcaption>The Navigator<p>Small compass · Outward gaze</p></figcaption></figure>
</main><script>document.querySelectorAll('button[data-bg]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.bg=button.dataset.bg;document.querySelectorAll('button[data-bg]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
